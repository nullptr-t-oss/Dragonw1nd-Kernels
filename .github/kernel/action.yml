        set -euo pipefail
        cd "${ROOT_DIR}/common"
        patch -p1 -i ${WILD_KERNEL_PATCHES}/next/scope_min_manual_hooks_v1.4.patch

    - name: Add KernelSU-Next Configuration Settings
      shell: bash

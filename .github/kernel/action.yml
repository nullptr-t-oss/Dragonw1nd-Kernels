name: Build Dragonw1nd Kernel
description: "Builds Kernel"

inputs:
  use_opt_patches:
    description: 'Do you want to add optimization patches in kernel?'
    required: false
    type: string
    default: 'false'
  ksun_branch_or_hash:
    required: true
    type: string
    default: ""
  use_susfs:
    description: 'Do you want to add susfs in kernel?'
    required: false
    type: string
    default: 'false'
  susfs_commit_hash_or_branch:
    required: false
    type: string
    default: ""
  github_token:
    required: true
    type: string

outputs:
  kernel_version:
    value: ${{ steps.get_kernel_version.outputs.kernel_version }}
  ksun_version:
    value: ${{ steps.add_ksun.outputs.ksun_version }}
  ksun_tag:
    value: ${{ steps.add_ksun.outputs.ksun_tag }}
  susfs_version:
    value: ${{ steps.add_susfs.outputs.susfs_version }}

runs:
  using: composite
  steps:
    - name: Get Kernel Version Info
      id: get_kernel_version
      shell: bash
      run: |
        set -euo pipefail
        cd "${ROOT_DIR}/common"
        CONFIG_FILES=("build.config.common" "build.config.constants")
        BRANCH_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [[ -f "$f" ]]; then
            l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
            if [[ -n "$l" ]]; then BRANCH_LINE="$l"; break; fi
          fi
        done
        if [[ -z "${BRANCH_LINE}" ]]; then
          echo "Error: No BRANCH= found"; exit 1
        fi
        BRANCH_VALUE="${BRANCH_LINE#*=}"
        ANDROID_RELEASE="${BRANCH_VALUE%-*}"
        if [[ -z "${ANDROID_RELEASE}" ]]; then
          echo "Could not parse android version from BRANCH=${BRANCH_VALUE}"
          exit 1
        fi
        KERNEL_VERSION_MAKE=$(make kernelversion)
        VERSION=$(echo ${KERNEL_VERSION_MAKE} | cut -d'.' -f1)
        PATCHLEVEL=$(echo ${KERNEL_VERSION_MAKE} | cut -d'.' -f2)
        SUBLEVEL=$(echo ${KERNEL_VERSION_MAKE} | cut -d'.' -f3)

        echo "ANDROID_RELEASE=${ANDROID_RELEASE}" >> "${GITHUB_ENV}"
        echo "kernelversion=${ANDROID_RELEASE}-${KERNEL_VERSION_MAKE}" >> "${GITHUB_ENV}"
        echo "SUSFS_KERNEL_BRANCH=gki-${ANDROID_RELEASE}-${VERSION}.${PATCHLEVEL}" >> "${GITHUB_ENV}"
        echo "kernel_version=${ANDROID_RELEASE}-${KERNEL_VERSION_MAKE}" >> "${GITHUB_OUTPUT}"

    - name: Clone susfs
      if: ${{ inputs.use_susfs == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        if [[ -z "${{ inputs.susfs_commit_hash_or_branch }}" ]]; then
          SUSFS_BRANCH="${{ env.SUSFS_KERNEL_BRANCH }}"
        else
          SUSFS_BRANCH="${{ inputs.susfs_commit_hash_or_branch }}"
        fi
        echo "Using SUSFS branch: ${SUSFS_BRANCH}"
        git clone https://gitlab.com/simonpunk/susfs4ksu.git
        cd susfs4ksu
        if git rev-parse --verify "origin/${SUSFS_BRANCH}" >/dev/null 2>&1 || git rev-parse --verify "${SUSFS_BRANCH}" >/dev/null 2>&1; then
          git checkout "${SUSFS_BRANCH}"
          SUSFS_COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "SUSFS_COMMIT_SHA=${SUSFS_COMMIT_SHA}" >> ${GITHUB_ENV}
        else
          echo "Error: SUSFS branch or ref '${SUSFS_BRANCH}' not found."
          exit 1
        fi

        ( "${MTIME_CACHE}" -t -d "$(pwd)" -k susfs )

        echo "susfs_dir=$(pwd)" >> "${GITHUB_ENV}"

    - name: Create custom defconfig fragment
      shell: bash
      run: |
        set -euo pipefail
        cd "${ROOT_DIR}/common"
        touch arch/arm64/configs/kernel.config

    - name: Add KernelSU Next
      id: add_ksun
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add KernelSU Next"
        cd "${ROOT_DIR}"
        echo "Adding KernelSU Next..."
        if [[ "${{ inputs.ksun_branch_or_hash }}" = "" ]]; then
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -
        else
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s "${{ inputs.ksun_branch_or_hash }}"
        fi
        git submodule update --init --recursive
        cd KernelSU-Next/kernel

        COMMITS_COUNT=$(git rev-list --count HEAD)
        KSUN_TAG=$(git describe --tags --abbrev=0 2>/dev/null)

        if [[ ${COMMITS_COUNT} -lt 2684 ]]; then
          BASE_VERSION=10200
        else
          BASE_VERSION=30000
        fi

        KSU_VERSION=$(expr ${COMMITS_COUNT} "+" ${BASE_VERSION})
        sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VERSION}/" Makefile

        if [[ -f ksu.c ]]; then
          sed -i 's/#if defined(CONFIG_STACKPROTECTOR) && (defined(CONFIG_ARM64) && !defined(CONFIG_STACKPROTECTOR_PER_TASK))/#if 0/' ksu.c
        fi

        if [[ "${KSU_VERSION}" -gt 33095 ]] && [[ "${{ env.KERNEL_VERSION }}" == "6.12" ]]; then
          sed -i 's|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include -I$(KSU_KERNEL_DIR)/include/uapi|' Kbuild
          sed -i 's|^KSU_KERNEL_DIR := $(srctree)/$(src)$|KSU_KERNEL_DIR := $(patsubst %/,%,$(dir $(abspath $(lastword $(MAKEFILE_LIST)))))|' Kbuild
          sed -i 's|^KSU_KERNEL_DIR := $(src)$|KSU_KERNEL_DIR := $(patsubst %/,%,$(dir $(abspath $(lastword $(MAKEFILE_LIST)))))|' Kbuild
        fi

        if [[ "${KSU_VERSION}" -lt 12884 ]]; then
          echo "NEED_HOOKS=true" >> ${GITHUB_ENV}
        else
          echo "NEED_HOOKS=false" >> ${GITHUB_ENV}
        fi

        cd ..
        echo "ksun_dir=$(pwd)" >> ${GITHUB_ENV}
        KSUN_COMMIT_SHA=$(git rev-parse --short HEAD)
        KSUN_COMMIT_SHA_FULL=$(git rev-parse HEAD)
        echo "KSUN_COMMIT_SHA=${KSUN_COMMIT_SHA}" >> ${GITHUB_ENV}
        echo "KSUN_COMMIT_SHA_FULL=${KSUN_COMMIT_SHA_FULL}" >> ${GITHUB_ENV}

        echo "KSUVER=${KSU_VERSION}" >> ${GITHUB_ENV}
        echo "ksun_version=${KSU_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "ksun_tag=${KSUN_TAG}" >> "${GITHUB_OUTPUT}"
        echo "KernelSU Next Version: ${KSU_VERSION}"
        echo "KernelSU Next added (commit: ${KSUN_COMMIT_SHA}) ✅"

        ( "${MTIME_CACHE}" -t -d "${ROOT_DIR}/KernelSU-Next" -k ksun )
        echo "::endgroup::"

    - name: Download KSUN Manager
      uses: nullptr-t-oss/composite_actions/fetch_ksu_manager@main
      with:
        ksu-type: ksun
        dist-dir: ${DIST_DIR}
        commit-hash: ${KSUN_COMMIT_SHA_FULL}
        github-token: ${{ inputs.github_token }}

    - name: Apply SUSFS Patches
      id: add_susfs
      if: ${{ inputs.use_susfs == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying SUSFS patches..."
        cd "${ROOT_DIR}"
        KERNEL_DIR="common"

        find "${susfs_dir}/kernel_patches/fs/" -maxdepth 1 -type f -exec cp -t "${KERNEL_DIR}/fs" {} +
        find "${susfs_dir}/kernel_patches/include/linux/" -maxdepth 1 -type f -exec cp -t "${KERNEL_DIR}/include/linux" {} +

        susfs_version=$(grep '#define SUSFS_VERSION' ${ROOT_DIR}/${KERNEL_DIR}/include/linux/susfs.h | awk -F'"' '{print $2}')
        echo "SUSVER=${susfs_version}" >> ${GITHUB_ENV}
        echo "susfs_version=${susfs_version:-unknown}" >> ${GITHUB_OUTPUT}
        echo "SuSFS Version: ${susfs_version}"

        _susfs_fix_patches="${WILD_KERNEL_PATCHES}/next/susfs_fix_patches"
        if [[ -d "${BOUTON_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}" ]]; then
          _susfs_fix_patches="${BOUTON_KERNEL_PATCHES}/next/susfs_fix_patches"
        fi
        echo "SusFS fix patches: ${_susfs_fix_patches}"

        # Function to compare semantic versions
        version_lte() {
          [[ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$1" ]]
        }

        if version_lte "${susfs_version:1}" "1.5.12"; then
          echo "NEED_HOOKS=true" >> ${GITHUB_ENV}
        else
          echo "NEED_HOOKS=false" >> ${GITHUB_ENV}
        fi

        cd "${ksun_dir}"

        case "${susfs_version}" in
          "v1.5.8")
            cp "${susfs_dir}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ./
            patch -p1 --forward --fuzz=3 -i 10_enable_susfs_for_ksu.patch  || true
            cp "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/fix_apk_sign.c.patch" ./
            patch -p1 --forward --fuzz=3 -i fix_apk_sign.c.patch
            cp "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/fix_core_hook.c.patch" ./
            patch -p1 --forward --fuzz=3 -i fix_core_hook.c.patch
            cp "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/fix_selinux.c.patch" ./
            patch -p1 --forward --fuzz=3 -i fix_selinux.c.patch
            cp "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/fix_ksud.c.patch" ./
            patch -p1 --forward --fuzz=3 -i fix_ksud.c.patch
            ;;
          "v1.5.9"|"v1.5.10"|"v1.5.11"|"v1.5.12")
            cp ${susfs_dir}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
            patch -p1 --forward -i 10_enable_susfs_for_ksu.patch  || true
            for file in $(find ./kernel -maxdepth 2 -name "*.rej" -printf "%f\n" | cut -d'.' -f1); do
              echo "Patching file: ${file}.c with fix_${file}.c.patch"
              patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/fix_${file}.c.patch"
            done
            patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/fix_kernel_compat.c.patch"
            ;;
          "v2.0.0")
            cp "${susfs_dir}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"./

            patch -p1 --forward -i 10_enable_susfs_for_ksu.patch  || true

            for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
              echo "Patching file: ${file} with fix_${file}.patch"
              patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/fix_${file}.patch"
            done
            echo "Patching Hook Mode!"
            patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/overwrite_hook_mode.patch"
            echo "Patching KSU_TOOLKIT Support for SuSFS kernel!"
            patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/ksu_toolkit.patch"
            ;;
          "v2.1.0")
            patch -p1 --forward -i "${susfs_dir}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
            for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
              echo "Patching file: ${file} with fix_${file}.patch"
              patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/fix_${file}.patch"
            done
            echo "Patching Hook Mode!"
            patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/overwrite_hook_mode.patch"
            echo "Patching KSU_TOOLKIT Support for SusFS kernel!"
            patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/ksu_toolkit.patch"

            if [[ "$KSUVER" -le 33095 ]]; then
              echo "Patching Multi-manager Support for SusFS kernel!"
              patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/multi_manager.patch"
            fi

            if [[ "$KSUVER" -ge 33068 ]] && [[ "$KSUVER" -lt 33070 ]]; then
                echo "Patching Multi-manager sepolicy Support for SusFS kernel!"
                patch -p1 --forward -i "${WILD_KERNEL_PATCHES}/next/susfs_fix_patches/${susfs_version}/multi_sepolicy_fix.patch"
            fi
            ;;
          "v2.3.0")
            patch -p1 --forward < "${susfs_dir}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
            for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
              echo "Patching file: ${file} with fix_${file}.patch"
              patch -p1 --forward < "${_susfs_fix_patches}/${susfs_version}/fix_${file}.patch"
            done
            echo "Patching Hook Mode!"
            patch -p1 --forward < "${_susfs_fix_patches}/${susfs_version}/overwrite_hook_mode.patch"
            echo "Patching KSU_TOOLKIT Support for SusFS kernel!"
            patch -p1 --forward < "${_susfs_fix_patches}/${susfs_version}/ksu_toolkit.patch"
            ;;
          *)
            echo "::error::Unsupported SUSFS version: ${susfs_version}"
            exit 1
            ;;
        esac
        cd "${ROOT_DIR}/${KERNEL_DIR}"
        if [[ "${{ env.ANDROID_RELEASE }}" = "android15" ]] && [[ "${{ env.KERNEL_VERSION }}" = "6.6" ]]; then
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
            sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi

          if ! grep -qxF 'extern void __fold_filemap_fixup_entry(struct vma_iterator *iter, unsigned long *end);' ./include/linux/page_size_compat.h; then
            patch -p1 < "${WILD_KERNEL_PATCHES}/common/backports/fold_fixup_entries.patch"
          fi
        fi

        # Fake kernel patch to fix failures
        fake_patched=0
        fake_patched_expand=0
        if [[ "${{ env.ANDROID_RELEASE }}" = "android15" ]] && [[ "${{ env.KERNEL_VERSION }}" = "6.6" ]]; then
          if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
            echo "nr_subpages Line not found. Fake Patching!"
            sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
            fake_patched=1
          fi

          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi

          if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
            echo "#include <linux/zswap.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/sched\/sysctl.h>/a #include <linux\/zswap.h>' ./mm/memory.c
          fi

          if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
            echo "Temporarily expand the last_vma_end if block to fix a matching issue."
            perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
            fake_patched_expand=1
          fi
        fi

        if [[ "${{ env.ANDROID_RELEASE }}" = "android12" ]] && [[ "${{ env.KERNEL_VERSION }}" = "5.10" ]]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi
        fi

        if [[ "${{ env.ANDROID_RELEASE }}" = "android13" ]] && [[ "${{ env.KERNEL_VERSION }}" = "5.15" ]]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi

          if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
            echo "#include swap_slots.h> Line found. Deleting header."
            sed -i '/#include <linux\/swap_slots.h>/d' ./mm/memory.c
            fake_patched=1
          fi
        fi

        if [[ "${{ env.ANDROID_RELEASE }}" = "android14" ]] && [[ "${{ env.KERNEL_VERSION }}" = "6.1" ]]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "vma_pages Line not found. Fake Patching!"
            fake_patched=1
          fi

          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            echo "#include <linux/dma-buf.h> Line not found. Adding missing header"
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
        fi

        super_fs_hook=0
        if grep -qxF '#include <trace/hooks/fs.h>' ./fs/super.c; then
          echo "Parking the fs/super.c vendor-hook include so SusFS can match"
          sed -i '/^#include <trace\/hooks\/fs\.h>$/,+1{/^#include <trace\/hooks\/fs\.h>$/d; /^$/d}' ./fs/super.c
          super_fs_hook=1
        fi

        patch -p1 -i "${susfs_dir}/kernel_patches/50_add_susfs_in_${{ env.SUSFS_KERNEL_BRANCH }}.patch"

        if [ "${super_fs_hook}" = 1 ]; then
          echo "Restoring the fs/super.c vendor-hook include"
          sed -i '0,/^static int thaw_super_locked/s|^static int thaw_super_locked|#include <trace/hooks/fs.h>\n\n&|' ./fs/super.c
        fi

        statfs_use=$(grep -n 'susfs_sus_kstat_spoof_vfs_statfs(' ./fs/statfs.c | head -n1 | cut -d: -f1 || true)
        statfs_decl=$(grep -n '^extern int susfs_sus_kstat_spoof_vfs_statfs' ./fs/statfs.c | head -n1 | cut -d: -f1 || true)
        if [ -n "${statfs_use}" ] && [ -n "${statfs_decl}" ] && [ "${statfs_decl}" -gt "${statfs_use}" ]; then
          echo "Hoisting the susfs_sus_kstat_spoof_vfs_statfs() declaration above its first use"
          cat > /tmp/susfs_statfs_proto.h <<'PROTO'
        extern int susfs_sus_kstat_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf, bool *is_fuse);
        PROTO
          sed -i '/^#endif \/\/ #ifdef CONFIG_KSU_SUSFS$/r /tmp/susfs_statfs_proto.h' ./fs/statfs.c
        fi

        if grep -q 'security_sb_statfs' ./fs/susfs.c && ! grep -q '^#include <linux/security.h>$' ./fs/susfs.c; then
          echo "Adding the missing <linux/security.h> include to fs/susfs.c"
          sed -i '/^#include <linux\/susfs.h>$/a #include <linux\/security.h>' ./fs/susfs.c
        fi

        if grep -q 'susfs_open_redirect_spoof_vfs_statfs' ./fs/statfs.c && ! grep -q '^int susfs_open_redirect_spoof_vfs_statfs' ./fs/susfs.c; then
          echo "Stubbing the missing susfs_open_redirect_spoof_vfs_statfs()"
          cat >> ./fs/susfs.c <<'STUB'
        int susfs_open_redirect_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf)
        {
          return 1;
        }
        STUB
        fi

        # SUSFS's OPEN_REDIRECT code unconditionally calls VMA_PAD_START(), which
        # only exists on GKI branches that carry Google's page-size-migration
        # feature (added to each android version's kernel/common branch at a
        # different, sometime later, os_patch_level). Older os_patch_levels in
        # our build matrix predate it, so fall back to a no-padding definition
        # when the real header/macro isn't present. This is version-agnostic and
        # a no-op wherever the real header already provides it.
        if grep -q 'VMA_PAD_START(' ./fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' ./fs/proc/task_mmu.c; then
          sed -i '\|#include "internal.h"|a\\n#undef VMA_PAD_START\n#ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          echo "Added VMA_PAD_START fallback definition to fs/proc/task_mmu.c"
        fi

        # Revert Fake kernel patch
        if [[ "${fake_patched_expand}" = 1 ]]; then
          if [[ "${{ env.ANDROID_RELEASE }}" = "android15" ]] && [[ "${{ env.KERNEL_VERSION }}" = "6.6" ]]; then
            if grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c && ! grep -qxF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c; then
              perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\) \{\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t\}/\t\t\tif (vma->vm_end > last_vma_end)\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);/' ./fs/proc/task_mmu.c
            fi
          fi
        fi

        if [[ "${fake_patched}" = 1 ]]; then
          if [[ "${{ env.ANDROID_RELEASE }}" = "android15" ]] && [[ "${{ env.KERNEL_VERSION }}" = "6.6" ]]; then
            if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              echo "nr_subpages Line found. Revert Fake Patching!"
              sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
            fi
          fi
          if [[ "${{ env.ANDROID_RELEASE }}" = "android12" ]] && [[ "${{ env.KERNEL_VERSION }}" = "5.10" ]]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
          fi
          if [[ "${{ env.ANDROID_RELEASE }}" = "android13" ]] && [[ "${{ env.KERNEL_VERSION }}" = "5.15" ]]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi

            if ! grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
              echo "#include <linux/swap_slots.h> Line not found. Adding missing header"
              sed -i '/#include <linux\/vmalloc.h>/a #include <linux\/swap_slots.h>' ./mm/memory.c
            fi
          fi
          if [[ "${{ env.ANDROID_RELEASE }}" = "android14" ]] && [[ "${{ env.KERNEL_VERSION }}" = "6.1" ]]; then
            if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
              echo "vma_pages Line found. Revert Fake Patching!"
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
          fi
        fi

        echo "FEATURES=${FEATURES:-} susfs" >> "${GITHUB_ENV}"

        echo "SuSFS added ✅"
        echo "::endgroup::"

    - name: Patch Ptrace
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::"
        cd "${ROOT_DIR}/common"
        MIN_VERSION="5.16"
        if [[ "$(printf '%s\n' "${KERNEL_VERSION}" "${MIN_VERSION}" | sort -V | head -n1)" == "${KERNEL_VERSION}" ]]; then
          echo "Patching ptrace!"
          patch -p1 -F 3 -i "${WILD_KERNEL_PATCHES}/gki_ptrace.patch"
        else
          echo "Kernel >= $MIN_VERSION, skipping ptrace patch"
        fi
        echo "::endgroup::"

    - name: Add BBG
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding BBG"
        cd "${ROOT_DIR}"
        echo "Adding BBG..."
        if ! wget -q -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main; then
          echo "::warning::BBG setup script failed, continuing anyway"
        fi
        cd "${ROOT_DIR}/common"
        ./scripts/config --file arch/arm64/configs/kernel.config -e CONFIG_BBG
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

        ( "${MTIME_CACHE}" -t -d "${ROOT_DIR}/Baseband-guard" -k bbg )

        echo "FEATURES=${FEATURES:-} bbg" >> "${GITHUB_ENV}"

        echo "BBG LSM added ✅"
        echo "::endgroup::"

    - name: Apply KSUN Hooks
      shell: bash

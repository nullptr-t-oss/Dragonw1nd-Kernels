    - name: Add SUSFS Configuration Settings
      if: ${{ inputs.use_susfs == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding SUSFS configs..."
        cd "${ROOT_DIR}/common"

        # Function to compare semantic versions
        version_lte() {
          [[ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$1" ]]
        }

        ./scripts/config --file arch/arm64/configs/kernel.config \
          -e CONFIG_KSU_SUSFS \
          -e CONFIG_KSU_SUSFS_SUS_PATH \
          -e CONFIG_KSU_SUSFS_SUS_MOUNT \
          -e CONFIG_KSU_SUSFS_SUS_KSTAT \
          -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
          -e CONFIG_KSU_SUSFS_ENABLE_LOG \
          -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
          -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
          -e CONFIG_KSU_SUSFS_SUS_MAP

        if ! version_lte "2.1.0" "${susfs_version:-1}"; then
          ./scripts/config --file arch/arm64/configs/kernel.config \
            -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -d CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -d CONFIG_KSU_SUSFS_SUS_SU
          fi

    - name: Add Oneplus BBR
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Adding Oneplus BBR"
        cd "${ROOT_DIR}/common"

        ./scripts/config --file arch/arm64/configs/kernel.config \
          -e CONFIG_TCP_CONG_ADVANCED \
          -e CONFIG_TCP_CONG_BBR \
          -e CONFIG_TCP_CONG_BBR3 \
          -e CONFIG_TCP_CONG_ROCCET \
          -e CONFIG_NET_SCH_FQ \
          -e CONFIG_NET_SCH_FQ_CODEL

        echo "OnePlus BBR added ✅"
        echo "::endgroup::"

    - name: Add my kernel patches to common kernel
      if: inputs.use_opt_patches == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying my patches from my repo..."
        cd "${ROOT_DIR}/common"

        if [[ -d "${KERNEL_KIT}/kernel_patches/${CODENAME}-${OS_SHORT}/common" ]]; then
          # We don't need to handle this actually but just in case if someone left an empty dir
          shopt -s nullglob

          for patch in "${KERNEL_KIT}/kernel_patches/${CODENAME}-${OS_SHORT}/common"/*.patch; do
            if patch -p1 -s -N -F0 --dry-run -i "$patch" >/dev/null 2>&1; then
              echo "Applying patch: ${patch}"
              patch -p1 -N -F0 -i "${patch}"
            else
              echo "Skipping patch (conflicts or already applied): ${patch}"
            fi
          done

          shopt -u nullglob
        fi

        echo "My kernel patches applied ❤️‍🔥"
        echo "::endgroup::"

    - name: Add other kernel patches to common kernel
      if: ${{ inputs.use_opt_patches == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying patches from wild kernels..."
        cd "${ROOT_DIR}/common"

        KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
        MIN_VERSION="5.16"
        PATCHES=(
          "${WILD_KERNEL_PATCHES}/common/optimized_mem_operations.patch"
          "${WILD_KERNEL_PATCHES}/common/file_struct_8bytes_align.patch"
          "${WILD_KERNEL_PATCHES}/common/reduce_cache_pressure.patch"
          "${WILD_KERNEL_PATCHES}/common/mem_opt_prefetch.patch"
        )

        if [[ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]]; then
          PATCHES+=("${WILD_KERNEL_PATCHES}/common/optimise_memcmp.patch")
        elif [[ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]]; then
          sed -i -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' \
                 -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' \
                 -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' \
                 "${WILD_KERNEL_PATCHES}/common/optimise_memcmp.patch"
          PATCHES+=("${WILD_KERNEL_PATCHES}/common/optimise_memcmp.patch")
        else
          echo "Optimised memcmp patch not found!"
        fi

        PATCHES+=(
          "${WILD_KERNEL_PATCHES}/common/minimise_wakeup_time.patch"
          "${WILD_KERNEL_PATCHES}/common/int_sqrt.patch"
          "${WILD_KERNEL_PATCHES}/common/reduce_gc_thread_sleep_time.patch"
          "${WILD_KERNEL_PATCHES}/common/add_timeout_wakelocks_globally.patch"
          "${WILD_KERNEL_PATCHES}/common/f2fs_reduce_congestion.patch"
          "${WILD_KERNEL_PATCHES}/common/reduce_freeze_timeout.patch"
        )

        if [[ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]]; then
          PATCHES+=("${WILD_KERNEL_PATCHES}/common/clear_page_16bytes_align.patch")
        else
          sed -i -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' "${WILD_KERNEL_PATCHES}/common/clear_page_16bytes_align.patch"
          PATCHES+=("${WILD_KERNEL_PATCHES}/common/clear_page_16bytes_align.patch")
        fi

        PATCHES+=(
          "${WILD_KERNEL_PATCHES}/common/adjust_cpu_scan_order.patch"
          "${WILD_KERNEL_PATCHES}/common/avoid_extra_s2idle_wake_attempts.patch"
          "${WILD_KERNEL_PATCHES}/common/disable_cache_hot_buddy.patch"
          "${WILD_KERNEL_PATCHES}/common/f2fs_enlarge_min_fsync_blocks.patch"
          "${WILD_KERNEL_PATCHES}/common/increase_ext4_default_commit_age.patch"
          "${WILD_KERNEL_PATCHES}/common/increase_sk_mem_packets.patch"
          "${WILD_KERNEL_PATCHES}/common/reduce_pci_pme_wakeups.patch"
          "${WILD_KERNEL_PATCHES}/common/silence_irq_cpu_logspam.patch"
          "${WILD_KERNEL_PATCHES}/common/silence_system_logspam.patch"
          "${WILD_KERNEL_PATCHES}/common/use_unlikely_wrap_cpufreq.patch"
        )

        for patch in "${PATCHES[@]}"; do
          if patch -p1 -s -N -F0 --dry-run -i "$patch" >/dev/null 2>&1; then
            echo "Applying patch: ${patch}"
            patch -p1 -N -F0 -i "${patch}"
          else
            echo "Skipping patch (conflicts or already applied): ${patch}"
          fi
        done

        echo "Other kernel patches applied 🔥"
        echo "::endgroup::"

    - name: Add Nethunter inline configs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Applying Nethunter configs..."
        cd "${ROOT_DIR}/common"


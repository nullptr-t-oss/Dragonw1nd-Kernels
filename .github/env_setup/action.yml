name: Setup Build Environment
description: "Setup build environment and sync kernel source"

inputs:
  op_config_json:
    description: 'JSON string containing full device config'
    required: true
    type: string
  manifest:
    required: true
    type: string
    default: OOS15
  clang_version:
    required: false
    type: string
    default: ""
  common_branch_or_commit:
    required: false
    type: string
    default: ""
  msm_branch_or_commit:
    required: false
    type: string
    default: ""
  vendor_branch_or_commit:
    required: false
    type: string
    default: ""
  optimize_level:
    required: false
    type: string
    default: O2  # Choices: O2 or O3
  kernel_uname:
    required: false
    type: string
    default: ""

outputs:
  os:
    value: ${{ steps.set_manifest.outputs.os }}
  os_short:
    value: ${{ steps.set_manifest.outputs.os_short }}

runs:
  using: composite
  steps:
    - name: Aggressive cleanup
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Cleanup space"

        (docker system prune -af && docker builder prune -af || true) &

        DIRS=(
          /usr/share/dotnet
          /usr/share/swift
          /usr/local/.ghcup
          /usr/local/julia*
          /usr/local/lib/android
          /usr/local/share/chromium
          /opt/microsoft
          /opt/google
          /opt/az
          /usr/local/share/powershell
          /opt/hostedtoolcache
        )

        printf "%s\0" "${DIRS[@]}" | xargs -0 -P 4 -n 1 sudo rm -rf

        wait
        df -h
        echo "::endgroup::"

    - name: Install Minimal Dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Install deps"
        sudo apt-get -o Acquire::Retries=3 update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          git curl ca-certificates build-essential clang lld flex bison \
          libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
          libxml2-utils rsync unzip dwarves file python3 mkbootimg device-tree-compiler attr
        sudo apt-get clean
        echo "::endgroup::"

    - name: Install ccache with ECS by cctv18
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Install ccache with ECS"
        wget -q https://github.com/nullptr-t-oss/kernel_kit/raw/refs/heads/main/bin/ccache-x86-64 -O ccache
        sudo cp -f ./ccache /usr/bin/ccache
        sudo chmod +x /usr/bin/ccache
        rm -f ./ccache

        echo "[DEBUG] Ccache version : $(ccache --version)"
        echo "::endgroup::"

    - name: Setup SWAP
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Parse op_config_json
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.op_config_json }}' > /tmp/config.json
        jq -r 'to_entries[] | select(.value | type == "string" or type == "number" or type == "boolean") | "\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "${GITHUB_ENV}"
        echo "Parsed config:"
        jq '.' /tmp/config.json

    - name: Set Manifest & grab OS details
      id: set_manifest
      shell: bash
      run: |
        set -euo pipefail
        selected=$(echo "${{ inputs.manifest }}" | tr '[:upper:]' '[:lower:]')  # OOS14 -> oos14

        key="manifest_${selected}"

        manifest_url=$(jq -r --arg k "$key" '.[$k].url // empty' /tmp/config.json)
        os=$(jq -r --arg k "$key" '.[$k].os // empty' /tmp/config.json)
        os_short=$(jq -r --arg k "$key" '.[$k].os_short // empty' /tmp/config.json)

        if [[ -z "${manifest_url}" ]]; then
          echo "::error::No manifest found for key '${key}' in config JSON"
          exit 1
        fi

        echo "MANIFEST=${manifest_url}" >> "${GITHUB_ENV}"
        echo "OS=${os}" >> "${GITHUB_ENV}"
        echo "OS_SHORT=${os_short}" >> "${GITHUB_ENV}"

        echo "os=${os}" >> "${GITHUB_OUTPUT}"
        echo "os_short=${os_short}" >> "${GITHUB_OUTPUT}"

        echo "Selected manifest: ${manifest_url}"
        echo "OS: ${os} (${os_short})"

        # Manifest-level overrides
        # Any extra scalar field in the manifest object (besides url/os/os_short)
        # is treated as an override for a top-level config key.
        overrides=$(jq -r --arg k "$key" \
          '.[$k] | to_entries[]
           | select(.key != "url" and .key != "os" and .key != "os_short")
           | select(.value | type == "string" or type == "number" or type == "boolean")
           | "\(.key | ascii_upcase)=\(.value)"' \
          /tmp/config.json)

        if [[ -n "${overrides}" ]]; then
          echo "Applying manifest-level overrides:"
          echo "${overrides}"
          echo "${overrides}" >> "${GITHUB_ENV}"
        else
          echo "No manifest-level overrides for '${key}'"
        fi

    - name: Validate Inputs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Validate inputs"
        model="$MODEL"
        soc="$SOC"
        branch="$BRANCH"
        manifest="$MANIFEST"
        optimize='${{ inputs.optimize_level }}'

        # Non-empty checks
        [[ -n "$model" ]] || { echo "Input 'model' cannot be empty"; exit 1; }
        [[ -n "$soc" ]] || { echo "Input 'soc' cannot be empty"; exit 1; }
        [[ -n "$branch" ]] || { echo "Input 'branch' cannot be empty"; exit 1; }
        [[ -n "$manifest" ]] || { echo "Input 'manifest' cannot be empty"; exit 1; }

        # Basic format checks
        # soc: allow letters, digits, underscores, dashes (e.g., sm8650)
        if ! [[ "$soc" =~ ^[A-Za-z0-9_-]+$ ]]; then
          echo "Input 'soc' contains invalid characters. Allowed: letters, digits, underscore, dash"; exit 1
        fi
        # branch: allow common ref patterns; spaces not allowed
        if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          echo "Input 'branch' contains invalid characters. Allowed: letters, digits, ., _, -, /"; exit 1
        fi
        # manifest: either HTTPS URL ending with .xml, or a filename ending with .xml (no spaces)
        if [[ "$manifest" == http*://* ]]; then
          if ! [[ "$manifest" =~ ^https:// ]]; then
            echo "Manifest URL must be HTTPS"; exit 1
          fi
          if ! [[ "$manifest" =~ \.xml($|\?) ]]; then
            echo "Manifest URL should point to an XML file (.xml)"; exit 1
          fi
        else
          if ! [[ "$manifest" =~ \.xml$ ]]; then
            echo "Manifest filename must end with .xml"; exit 1
          fi
          if [[ "$manifest" =~ [[:space:]] ]]; then
            echo "Manifest filename cannot contain spaces"; exit 1
          fi
        fi
        # Optimize level validation
        case "$optimize" in
          O2|O3) ;;
          *) echo "optimize_level must be O2 or O3; got '$optimize'"; exit 1 ;;
        esac
        echo "Input validation OK."
        echo "::endgroup::"

    - name: Clone AnyKernel3 and Other Dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "Cloning AnyKernel3 and other dependencies..."
        ANYKERNEL_BRANCH="gki-2.0"

        echo "Using AnyKernel3 branch: $ANYKERNEL_BRANCH"
        git clone --depth=1 https://github.com/nullptr-t-oss/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
        git clone --depth=1 https://github.com/TheWildJames/kernel_patches.git
        git clone --depth=1 https://github.com/nullptr-t-oss/kernel_kit.git

    - name: Setup Base Environment
      shell: bash
      run: |
        set -euo pipefail

        WILD_KERNEL_PATCHES="${GITHUB_WORKSPACE}/kernel_patches"
        KERNEL_KIT="${GITHUB_WORKSPACE}/kernel_kit"
        BUILD_CONFIG=${KERNEL_KIT}/device/${CODENAME}-${OS_SHORT}/build_config/build.config.${CODENAME}.${OS_SHORT}
        

        # Export standard gki variables
        ANDROID_BUILD_TOP="${GITHUB_WORKSPACE}/${CODENAME}-${OS_SHORT}"
        KERNEL_PLATFORM="${ANDROID_BUILD_TOP}/kernel_platform"
        ROOT_DIR=${KERNEL_PLATFORM}
        OUT_DIR="${ROOT_DIR}/out"
        DIST_DIR="${ROOT_DIR}/dist"


        DYNAMIC_CACHE_DIR="${OUT_DIR}/dynamic_cache"
        MTIME_CACHE="${KERNEL_KIT}/scripts/dynamic_mtime.sh"

        echo "Creating folder for configuration: ${ANDROID_BUILD_TOP}"
        mkdir -p "${ANDROID_BUILD_TOP}"

        mkdir -p "${OUT_DIR}"
        mkdir -p "${DIST_DIR}"
        mkdir -p "${DYNAMIC_CACHE_DIR}"
        
        echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP}" >> "${GITHUB_ENV}"

        echo "ROOT_DIR=${ROOT_DIR}" >> "${GITHUB_ENV}"
        echo "OUT_DIR=${OUT_DIR}" >> "${GITHUB_ENV}"
        echo "DIST_DIR=${DIST_DIR}" >> "${GITHUB_ENV}"
        echo "KERNEL_PLATFORM=${KERNEL_PLATFORM}" >> "${GITHUB_ENV}"

        echo "WILD_KERNEL_PATCHES=${WILD_KERNEL_PATCHES}" >> "${GITHUB_ENV}"
        echo "KERNEL_KIT=${KERNEL_KIT}" >> "${GITHUB_ENV}"
        echo "BUILD_CONFIG=${BUILD_CONFIG}" >> "${GITHUB_ENV}"
        echo "MTIME_CACHE=${MTIME_CACHE}" >> "${GITHUB_ENV}"
        echo "DYNAMIC_CACHE_DIR=${DYNAMIC_CACHE_DIR}" >> "${GITHUB_ENV}"

        chmod +x "${MTIME_CACHE}"

        # Install repo tool if missing
        REPO="/usr/local/bin/repo"
        if [ ! -x "${REPO}" ]; then
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$REPO"
          chmod +x "${REPO}"
        fi
        echo "REPO=${REPO}" >> "${GITHUB_ENV}"

    - name: Optimize Global Git for Repo Tool
      shell: bash
      run: |
        set -euo pipefail
        git config --global feature.manyFiles true
        git config --global pack.sparse true
        git config --global core.compression 0
        git config --global http.postBuffer 524288000
        git config --global core.fsmonitor false
        git config --global index.threads $(nproc)

    - name: Initialize and Sync Kernel Source
      shell: bash
      run: |
        set -euo pipefail
        cd "${ANDROID_BUILD_TOP}"
        echo "Initializing and syncing kernel source..."
        if [[ "${MANIFEST}" == https://* ]]; then
          mkdir -p .repo/manifests
          curl -s --fail --show-error --location --proto '=https' "${MANIFEST}" -o .repo/manifests/temp_manifest.xml
          "${REPO}" init -u https://github.com/OnePlusOSS/kernel_manifest.git -b oneplus/sm8650 -m temp_manifest.xml --repo-rev=stable --depth=1 --no-clone-bundle --no-tags
        else
          "${REPO}" init -u https://github.com/OnePlusOSS/kernel_manifest.git -b "${BRANCH}" -m "${MANIFEST}" --repo-rev=stable --depth=1 --no-clone-bundle --no-tags
        fi
        "${REPO}" --version
        success=false
        for i in 1 2 3; do
          if "${REPO}" sync -c --no-clone-bundle --no-tags --optimized-fetch \
             -j"$(nproc --all)" --fail-fast; then
            success=true
            break
          fi
          echo "repo sync attempt $i failed; retrying..."
          sleep 30
        done
        ${success} || { echo "repo sync failed after 3 attempts"; exit 1; }

    - name: Checkout custom branch or commit hash for sources
      shell: bash
      run: |
        set -euo pipefail

        cd "${ROOT_DIR}/common"
        if [[ -z "${{ inputs.common_branch_or_commit }}" ]]; then
          echo "Custom branch or commit not specified, proceeding on current HEAD of common kernel "
          echo "Current HEAD for COMMON kernel repo is at:"
          git show HEAD --no-patch
        else
          git fetch --all --depth=1
          git checkout "${{ inputs.common_branch_or_commit }}"
          echo "Current HEAD for COMMON kernel repo is at:"
          git show HEAD --no-patch
        fi

        cd "${ANDROID_BUILD_TOP}"
        if [[ -z "${{ inputs.vendor_branch_or_commit }}" ]]; then
          echo "Custom branch or commit not specified, proceeding on current HEAD of vendor modules and device tree branch"
          echo "Current HEAD for vendor modules repo is at:"
          git show HEAD --no-patch
        else
          git fetch --all --depth=1
          git checkout "${{ inputs.vendor_branch_or_commit }}"
          echo "Current HEAD for vendor modules repo is at:"
          git show HEAD --no-patch
        fi
        
        if [[ "${TREE}" == "mixed" ]]; then
          cd "${ROOT_DIR}/msm-kernel"
          if [[ -z "${{ inputs.msm_branch_or_commit }}" ]]; then
            echo "Custom branch or commit not specified, proceeding on current HEAD of msm kernel"
            echo "Current HEAD for MSM kernel repo is at:"
            git show HEAD --no-patch
          else
            git fetch --all --depth=1
            git checkout "${{ inputs.msm_branch_or_commit }}"
            echo "Current HEAD for MSM kernel repo is at:"
            git show HEAD --no-patch
          fi
        fi

    - name: Export kernel build-tools path
      shell: bash
      run: |
        if [[ -d "${KERNEL_KIT}/bin/kernel/prebuilts/build-tools/linux_musl-x86/bin" ]]; then
          echo "${KERNEL_KIT}/bin/kernel/prebuilts/build-tools/linux_musl-x86/bin" >> "${GITHUB_PATH}"
        else
          if [[ -d "${KERNEL_KIT}/bin/kernel/prebuilts/build-tools/linux-x86/bin" ]]; then
            echo "${KERNEL_KIT}/bin/kernel/prebuilts/build-tools/linux-x86/bin" >> "${GITHUB_PATH}"
          else
            echo "::error:: kernel build-tools not found in KERNEL_KIT!"
          fi
        fi

    - name: Setup clang type
      if: ${{ inputs.clang_version != 'default' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "CLANG=${{ inputs.clang_version }}" >> "${GITHUB_ENV}"

    - name: Download Clang (toolchain for build)
      uses: nullptr-t-oss/kernel_toolchains/clang_setup@main
      if: env.CLANG != 'manifest'
      with:
        clang-version: '${{ env.CLANG }}'
        install-dir: '${{ env.KERNEL_PLATFORM }}/prebuilts/clang/host/linux-x86'

    - name: Detect Clang (toolchain for build)
      if:  env.CLANG == 'manifest'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Detecting Clang..."
        CLANG_FOUND=false
        for base in "${KERNEL_PLATFORM}/prebuilts" "${KERNEL_PLATFORM}/prebuilts-master"; do
          [ -d "${base}/clang/host/linux-x86" ] || continue

          latest=$(ls -d "$base"/clang/host/linux-x86/clang-r*/ 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "${latest}" ] && [ -x "${latest}/bin/clang" ]; then
            CLANG_BIN="${latest}/bin"
            CLANG_FOUND=true
          fi
        done
        if ! ${CLANG_FOUND} && command -v clang >/dev/null 2>&1; then
          CLANG_BIN="$(dirname "$(command -v clang)")"
          CLANG_FOUND=true
          echo "Using system clang."
        fi
        ${CLANG_FOUND} || { echo "No clang toolchain found"; exit 1; }
        echo "${CLANG_BIN}" >> "${GITHUB_PATH}"
        CLANG_VERSION="$("${CLANG_BIN}/clang" --version | head -n1)"
        echo "CLANG_VERSION=${CLANG_VERSION}" >> "${GITHUB_ENV}"
        echo "[NOTICE] Using clang : ${CLANG_VERSION}"

        echo "Clang detected ✅"
        echo "::endgroup::"

    - name: Restore build cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.OUT_DIR }}
        key: cache-${{ env.CODENAME }}-${{ env.OS_SHORT }}-${{ inputs.optimize_level }}-${{ inputs.kernel_uname }}-${{ env.KERNEL_VERSION }}

    - name: Fast build mtime hack
      shell: bash
      run: |
        # :)

        if [[ "${TREE}" == "mixed" ]]; then
          ( "${MTIME_CACHE}" -t -d "${ROOT_DIR}/common" -k gki-kernel )
          ( "${MTIME_CACHE}" -t -d "${ROOT_DIR}/msm-kernel" -k  msm-kernel )
        else
          (  "${MTIME_CACHE}" -t -d "${ROOT_DIR}/common" -k gki-kernel )
        fi

        if [[ -d "${ANDROID_BUILD_TOP}/vendor" ]]; then
          ( "${MTIME_CACHE}" -t -d "${ANDROID_BUILD_TOP}/vendor" -k vendor )
        fi

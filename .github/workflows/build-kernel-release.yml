name: Build and Release EmberHeart Kernel and Kernel Modules

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select type of Github release?'
        required: true
        type: choice
        options:
          - none
          - Pre-release
          - Release
        default: none
      manifest:
        description: 'Select manifest'
        required: true
        type: choice
        options:
          - OOS14
          - OOS15
          - OOS16
          - OOS16_CUSTOM
          - LOS_22_2
          - LOS_23_2
          - HOS
          - CUSTOM
        default: OOS16_CUSTOM
      use_opt_patches:
        description: 'Do you want to add optimization patches in kernel?'
        required: true
        type: boolean
        default: true
      use_susfs:
        description: 'Do you want to add susfs in kernel?'
        required: true
        type: boolean
        default: true
      ksun_branch:
        description: 'Enter KernelSU Next Branch or commit hash (blank for stable tag)'
        required: true
        type: string
        default: dev
      optimize_level:
        description: "Compiler optimization level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      lto:
        description: "Link Time Optimization level"
        required: true
        type: choice
        options: [none, thin, full]
        default: none
      clang_version:
        description: "Select Compiler version"
        required: true
        type: choice
        options:
          - default
          - aosp-clang-3289846
          - aosp-clang-r547379
          - aosp-clang-r563880
          - aosp-clang-r563880c
          - aosp-clang-r574158
        default: 'default'
      kernel_uname:
        description: 'Kernel uname'
        type: string
        default: ''
      susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash'
        type: string
        default: ''
      vendor_branch_or_commit:
        description: 'Enter vendor modules and device tree branch or commit hash'
        type: string
        default: ''
      common_branch_or_commit:
        description: 'Enter COMMON kernel branch or commit hash'
        type: string
        default: ''
      msm_branch_or_commit:
        description: 'Enter MSM kernel branch or commit hash'
        type: string
        default: ''
      compile_dlkm:
        description: '[Under Testing dont use] Do you want to use vendor dlkm and boot partitions?'
        required: true
        type: boolean
        default: false
      model:
        description: 'Select device to be built'
        required: true
        type: choice
        options:
          - OP11
          - OP12
          - OP12R
          - POCO_F6
          - POCO_X6
          - REDMI_15
          - REDMI_12
        default: OP11

jobs:
  set-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code (to access configs/)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: Setup Model
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          declare -a models=()
          while IFS= read -r -d '' file; do
            model=$(basename "$file" .json)
            models+=("$model")
          done < <(find configs/ -name "*.json" -print0)
        
          if [ ${#models[@]} -eq 0 ]; then
            echo "Error: No config files found in configs/ directory!"
            exit 1
          fi
        
          echo "[" > matrix.json
          for i in "${!models[@]}"; do
            model="${models[$i]}"
            file="configs/$model.json"
            if [ -f "$file" ]; then
              jq -r '.' "$file" >> matrix.json
              if [ $((i+1)) -lt ${#models[@]} ]; then
                echo "," >> matrix.json
              fi
            fi
          done
          echo "]" >> matrix.json

          input="${{ inputs.model }}"
          jq_filter="map(select(.model == \"$input\"))"

          filtered=$(jq -c "$jq_filter" matrix.json)
          wrapped=$(jq -n --argjson items "$filtered" '{ include: $items }')

          echo "matrix<<MATRIX_EOF" >> "${GITHUB_OUTPUT}"
          echo "$wrapped" >> "${GITHUB_OUTPUT}"
          echo "MATRIX_EOF" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.product }} EmberHeart
    needs: set-model
    runs-on: ubuntu-latest
    outputs:
      product: ${{ matrix.product }}
      codename: ${{ matrix.codename }}
      os: ${{ steps.setup_env.outputs.os }}
      os_short: ${{ steps.setup_env.outputs.os_short }}
      kernel_version: ${{ steps._kernel.outputs.kernel_version }}
      ksun_version: ${{ steps._kernel.outputs.ksun_version }}
      ksun_tag: ${{ steps._kernel.outputs.ksun_tag }}
      susfs_version: ${{ steps._kernel.outputs.susfs_version }}
      features: ${{ steps._modules.outputs.features }}
      kernel_sha256: ${{ steps.build.outputs.kernel_sha256 }}
      boot_sha256: ${{ steps.build.outputs.boot_sha256 }}
      system_dlkm_sha256: ${{ steps.build.outputs.system_dlkm_sha256 }}
      vendor_boot_sha256:  ${{ steps.build.outputs.vendor_boot_sha256 }}
      vendor_dlkm_sha256: ${{ steps.build.outputs.vendor_dlkm_sha256 }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-model.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Telegram secrets
        id: tg_check
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.TG_BOT_TOKEN }}" ] || [ -z "${{ vars.TG_CHAT_ID }}" ] || [ -z "${{ secrets.TG_API_ID }}" ] || [ -z "${{ secrets.TG_API_HASH }}" ]; then
            echo "::warning::Telegram secrets not configured — notifications will be skipped (expected on forks)."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Determine notify thread
        id: tg_thread
        if: steps.tg_check.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.release_type }}" == "Release" ]; then
            echo "thread_id=${{ vars.TG_THREAD_RELEASE }}" >> "${GITHUB_OUTPUT}"
          else
            echo "thread_id=${{ vars.TG_THREAD_DEV }}" >> "${GITHUB_OUTPUT}"
          fi
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "${GITHUB_OUTPUT}"

      - name: Track build start time
        if: steps.tg_check.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_START=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Start local Telegram Bot API server
        id: tg_server
        if: steps.tg_check.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name tg-bot-api-${{ strategy.job-index }} \
            -p 0:8081 \
            -e TELEGRAM_API_ID="${{ secrets.TG_API_ID }}" \
            -e TELEGRAM_API_HASH="${{ secrets.TG_API_HASH }}" \
            -e TELEGRAM_LOCAL=true \
            aiogram/telegram-bot-api:latest

          sleep 2

          if ! docker ps --filter "name=tg-bot-api-${{ strategy.job-index }}" --filter "status=running" | grep -q tg-bot-api; then
            echo "::warning::Telegram Bot API container is not running — dumping logs and skipping notifications."
            docker logs "tg-bot-api-${{ strategy.job-index }}" || true
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          HOST_PORT=$(docker port tg-bot-api-${{ strategy.job-index }} 8081/tcp | cut -d: -f2)
          echo "container_name=tg-bot-api-${{ strategy.job-index }}" >> "${GITHUB_OUTPUT}"
          echo "api_base=http://localhost:${HOST_PORT}" >> "${GITHUB_OUTPUT}"

          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${HOST_PORT}/bot${{ secrets.TG_BOT_TOKEN }}/getMe" > /dev/null; then
              echo "Local Bot API server is up on port ${HOST_PORT}."
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Local Bot API server did not become ready in time — notifications will be skipped for this run."
          echo "enabled=false" >> "${GITHUB_OUTPUT}"

      - name: Setup Build Environment
        id: setup_env
        uses: ./.github/env_setup
        with:
          op_config_json: ${{ toJSON(matrix) }}
          manifest: ${{ inputs.manifest }}
          clang_version: ${{ inputs.clang_version }}
          common_branch_or_commit: ${{ inputs.common_branch_or_commit }}
          msm_branch_or_commit: ${{ inputs.msm_branch_or_commit }}
          vendor_branch_or_commit: ${{ inputs.vendor_branch_or_commit }}
          optimize_level: ${{ inputs.optimize_level }}
          kernel_uname: ${{ inputs.kernel_uname }}

      - name: Kernel modifications
        id: _kernel
        uses: ./.github/kernel
        with:
          use_opt_patches: ${{ inputs.use_opt_patches }}
          ksun_branch_or_hash: ${{ inputs.ksun_branch }}
          use_susfs: ${{ inputs.use_susfs }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_branch_or_commit }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kernel Modules modifications
        id: _modules
        uses: ./.github/kernel_modules

      - name: Start build
        id: build
        uses: ./.github/build
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: "content"
          CCACHE_NOHASHDIR: "true"
          CCACHE_DEPEND: "true"
          CCACHE_IGNOREOPTIONS: "--sysroot*"
          CCACHE_DIRECT: "true"
          CCACHE_FILECLONE: "true"
          CCACHE_INODE_CACHE: "true"
          CCACHE_UMASK: "002"
          CCACHE_SLOPPINESS: "file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale,modules"
          CCACHE_IS_KERNEL_COMPILING: "true"
        with:
          use_susfs: ${{ inputs.use_susfs }}
          optimize_level: ${{ inputs.optimize_level }}
          lto: ${{ inputs.lto }}
          kernel_uname: ${{ inputs.kernel_uname }}
          compile_dlkm: ${{ inputs.compile_dlkm }}

      - name: Distribution
        id: distribution
        uses: ./.github/distribution
        with:
          tg_enabled: ${{ steps.tg_check.outputs.enabled }}
          tg_bot_token: ${{ secrets.TG_BOT_TOKEN }}
          tg_chat_id: ${{ vars.TG_CHAT_ID }}
          tg_thread_id: ${{ steps.tg_thread.outputs.thread_id }}
          tg_api_base: ${{ steps.tg_server.outputs.api_base }}
          tg_send_debug: ${{ inputs.release_type == 'none' }}
          release_type: ${{ inputs.release_type }}
          lto: ${{ inputs.lto }}
          optimize_level: ${{ inputs.optimize_level }}
          kernel_uname: ${{ inputs.kernel_uname }}
          ksun_version: ${{ steps._kernel.outputs.ksun_version }}
          build_start: ${{ env.BUILD_START }}
          features: ${{ steps._modules.outputs.features }}

      - name: Stop local Telegram Bot API server
        if: always() && steps.tg_check.outputs.enabled == 'true'
        shell: bash
        run: docker rm -f "${{ steps.tg_server.outputs.container_name }}" || true

  trigger-release:
    needs:
      - build
    runs-on: ubuntu-latest
    if: ${{ inputs.release_type != 'none' }}
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Wirless Firmware Module for Nethunter 
        id: download_external
        env:
          SOURCE_REPO: nullptr-t-oss/Nethunter-Wireless-Firmware 
        run: |
          echo "--- Downloading Latest Release Asset from $SOURCE_REPO ---"

          DOWNLOAD_DIR="./downloaded-artifacts/wireless-firmware"
          mkdir -p "$DOWNLOAD_DIR"

          LATEST_RELEASE_TAG=$(gh api \
            repos/$SOURCE_REPO/releases/latest \
            --jq '.tag_name')

          if [ -z "$LATEST_RELEASE_TAG" ]; then
            echo "::warning::Could not find a latest release in $SOURCE_REPO. Skipping external download."
            exit 0
          fi

          echo "Found latest release tag: $LATEST_RELEASE_TAG"

          SOURCE_REPO_NAME=$(basename $SOURCE_REPO)
          EXPECTED_ASSET_NAME="${SOURCE_REPO_NAME}-${LATEST_RELEASE_TAG}.zip"

          gh release download $LATEST_RELEASE_TAG \
            --repo $SOURCE_REPO \
            --pattern $EXPECTED_ASSET_NAME \
            --dir $DOWNLOAD_DIR \
            --clobber

          echo "Finished downloading $EXPECTED_ASSET_NAME to $DOWNLOAD_DIR."

      - name: Generate Release name
        run: |
          DEVICE="${{ needs.build.outputs.product }}"

          if [[ -n "${{ needs.build.outputs.susfs_version }}" ]]; then
            RELEASE_NAME="${DEVICE} ( ${{ needs.build.outputs.codename }} ) ${{ needs.build.outputs.os }} EmberHeart Kernel With KernelSU Next ${{ needs.build.outputs.ksun_tag }}, Nethunter & SUSFS ${{ needs.build.outputs.susfs_version }}"
          else
            RELEASE_NAME="${DEVICE} ( ${{ needs.build.outputs.codename }} ) ${{ needs.build.outputs.os }} EmberHeart Kernel With KernelSU Next ${{ needs.build.outputs.ksun_tag }} & Nethunter"
          fi
          echo "RELEASE_NAME=$RELEASE_NAME" >> "${GITHUB_ENV}"

      - name: Generate and Create New Tag
        run: |
          BASE_TAG="${{ needs.build.outputs.codename }}-${{ needs.build.outputs.os_short }}-${{ needs.build.outputs.ksun_tag }}-r0"
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="$BASE_TAG"
          else
            LATEST_TAG=$(printf "%s\n%s\n" "$LATEST_TAG" "$BASE_TAG" | sort -rV | head -n1)
          fi
          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> ${GITHUB_ENV}
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Export device config to env
        shell: bash
        run: |
          set -euo pipefail
          CODENAME="${{ needs.build.outputs.codename }}"
          CONFIG_FILE=$(grep -l "\"codename\": *\"${CODENAME}\"" configs/*.json | head -n1)
          if [ -z "${CONFIG_FILE}" ]; then
            echo "::warning::No configs/*.json matched codename '${CODENAME}' — release notes will be missing device-config fields (SOC, MODEL, etc)."
            exit 0
          fi
          jq -r 'to_entries[] | select(.value | type == "string" or type == "number" or type == "boolean") | "\(.key | ascii_upcase)=\(.value)"' "${CONFIG_FILE}" >> "${GITHUB_ENV}"
          echo "Exported device config from ${CONFIG_FILE}"

      - name: Generate Device List and Final Release Notes
        id: generate-notes
        env:
          PRODUCT: ${{ needs.build.outputs.product }}
        run: |
          set -euo pipefail
          IFS=',' read -ra FEATURES <<< "${{ needs.build.outputs.features }}"
          FEAT_ARGS=()
          for f in "${FEATURES[@]}"; do
            [ -n "$f" ] && FEAT_ARGS+=(--feat "$f")
          done

          FILE_ARGS=()
          for f in ./downloaded-artifacts/*/*.{zip,img}; do
            [ -f "$f" ] && FILE_ARGS+=(--file "$f")
          done

          SUSFS_ARGS=()
          if [[ -n "${{ needs.build.outputs.susfs_version }}" ]]; then
            SUSFS_ARGS=(--susfs-version "${{ needs.build.outputs.susfs_version }}")
          fi

          python3 .github/telegram/release_readme.py \
            --release-type "${{ inputs.release_type }}" \
            --os "${{ needs.build.outputs.os }}" \
            --kernel-version "${{ needs.build.outputs.kernel_version }}" \
            --ksun-tag "${{ needs.build.outputs.ksun_tag }}" \
            --ksun-version "${{ needs.build.outputs.ksun_version }}" \
            "${SUSFS_ARGS[@]}" \
            "${FEAT_ARGS[@]}" \
            "${FILE_ARGS[@]}" \
            --out release_notes.md

          echo "--- Final Release Notes ---"
          cat release_notes.md

      - name: Create GitHub Pre-release
        if: ${{ inputs.release_type == 'Pre-release' }}
        run: |
          gh release create "${{ env.NEW_TAG }}" \
            --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
            --title "*Test-build*-${{ env.RELEASE_NAME }}-*Test Build*" \
            --notes-file release_notes.md \
            --prerelease

      - name: Create GitHub Release
        if: ${{ inputs.release_type == 'Release' }}
        run: |
          gh release create "${{ env.NEW_TAG }}" \
            --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
            --title "${{ env.RELEASE_NAME }}" \
            --notes-file release_notes.md

      - name: Upload Release Assets Dynamically
        run: |
          for file in ./downloaded-artifacts/*/*.{zip,img}; do
            if [ -f "${file}" ]; then
              echo "Uploading ${file}..."
              gh release upload "${{ env.NEW_TAG }}" "${file}" --clobber
            fi
          done

name: Artifacts Distribution
description: "Artifacts Distribution"

inputs:
  tg_enabled:
    description: 'Whether Telegram notifications are configured (from tg_check gate)'
    required: false
    type: string
    default: 'false'
  tg_bot_token:
    required: false
    type: string
    default: ''
  tg_chat_id:
    required: false
    type: string
    default: ''
  tg_thread_id:
    required: false
    type: string
    default: ''
  tg_api_base:
    description: 'Bot API base URL (local server or cloud API)'
    required: false
    type: string
    default: 'https://api.telegram.org'
  tg_send_debug:
    description: 'Whether to send the debug bundle (false for release/pre-release builds)'
    required: false
    type: string
    default: 'true'
  kernel_sha256:
    required: false
    type: string
    default: ''
  boot_sha256:
    required: false
    type: string
    default: ''
  system_dlkm_sha256:
    required: false
    type: string
    default: ''
  vendor_boot_sha256:
    required: false
    type: string
    default: ''
  vendor_dlkm_sha256:
    required: false
    type: string
    default: ''
  build_start_human:
    description: 'Human-readable build start time, set by the calling workflow'
    required: false
    type: string
    default: ''

runs:
  using: composite
  steps:
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.CODENAME }}-${{ env.OS_SHORT }}
        path: ${{ env.DIST_DIR }}/

    - name: Zip debug artifacts for Telegram uploads
      id: tg_debug_zip
      if: ${{ inputs.tg_enabled == 'true' && inputs.tg_send_debug == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        DEBUG_ZIP="/tmp/debug-common-${{ env.CODENAME }}-${{ env.OS_SHORT }}-${GITHUB_RUN_NUMBER}.zip"
        ( cd "${DIST_DIR}" && zip -r9 "${DEBUG_ZIP}" ./* >/dev/null )
        echo "zip_path=${DEBUG_ZIP}" >> "${GITHUB_OUTPUT}"

    - name: Build "success" message
      id: msg_success
      if: ${{ inputs.tg_enabled == 'true' }}
      shell: bash
      env:
        KERNEL_SHA256: ${{ inputs.kernel_sha256 }}
        BOOT_SHA256: ${{ inputs.boot_sha256 }}
        SYSTEM_DLKM_SHA256: ${{ inputs.system_dlkm_sha256 }}
        VENDOR_BOOT_SHA256: ${{ inputs.vendor_boot_sha256 }}
        VENDOR_DLKM_SHA256: ${{ inputs.vendor_dlkm_sha256 }}
        BUILD_START_HUMAN: ${{ inputs.build_start_human }}
      run: |
        {
          echo "text<<TGMSG_EOF"
          bash .github/telegram/build_message.sh success
          echo "TGMSG_EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Upload modules artifacts
      if: ${{ inputs.tg_enabled == 'true' }}
      uses: ./.github/telegram
      with:
        bot_token: ${{ inputs.tg_bot_token }}
        chat_id: ${{ inputs.tg_chat_id }}
        thread_id: ${{ inputs.tg_thread_id }}
        api_base_url: ${{ inputs.tg_api_base }}
        mode: rich-with-file
        files: |
          ${{ env.DIST_DIR }}/${{ env.AK3_ZIP }}
          ${{ env.DIST_DIR }}/boot.img
          ${{ env.DIST_DIR }}/ksun.apk
          ${{ env.DIST_DIR }}/ksun_spoofed.apk
          ${{ env.DIST_DIR }}/modules.zip
          ${{ env.DIST_DIR }}/gki-modules.tar.gz
          ${{ env.DIST_DIR }}/modules.tar.gz
          ${{ env.DIST_DIR }}/system_dlkm.img
          ${{ env.DIST_DIR }}/vendor_boot.img
          ${{ env.DIST_DIR }}/vendor_dlkm.img
        message: ${{ steps.msg_success.outputs.text }}

    - name: Upload debug artifacts to Telegram
      if: ${{ inputs.tg_enabled == 'true' && inputs.tg_send_debug == 'true' && steps.tg_debug_zip.outputs.zip_path != '' }}
      uses: ./.github/telegram
      with:
        bot_token: ${{ inputs.tg_bot_token }}
        chat_id: ${{ inputs.tg_chat_id }}
        thread_id: ${{ inputs.tg_thread_id }}
        api_base_url: ${{ inputs.tg_api_base }}
        mode: rich-with-file
        files: |
          ${{ steps.tg_debug_zip.outputs.zip_path }}
        message: |
          # Debug Artifacts

          | Model | ${{ env.PRODUCT }} |
          | --- | --- |
          | Build time | ${{ env.BUILD_TIME }} |